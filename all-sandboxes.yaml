apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alpine-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: python-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cpp-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: debian-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-sandbox-alpine
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linux-sandbox-alpine
  template:
    metadata:
      labels:
        app: linux-sandbox-alpine
    spec:
      containers:
      - name: ttyd
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
        - apk add --no-cache ttyd bash && ttyd -W -p 7681 bash
        ports:
        - containerPort: 7681
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: alpine-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-sandbox
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-sandbox
  template:
    metadata:
      labels:
        app: python-sandbox
    spec:
      containers:
      - name: ttyd
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - |
          apt-get update && apt-get install -y curl wget git vim
          wget -O /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x /usr/local/bin/ttyd
          ttyd -W -p 7681 bash
        ports:
        - containerPort: 7681
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: python-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpp-sandbox
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpp-sandbox
  template:
    metadata:
      labels:
        app: cpp-sandbox
    spec:
      containers:
      - name: ttyd
        image: gcc:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          apt-get update && apt-get install -y curl wget git make
          wget -O /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x /usr/local/bin/ttyd
          ttyd -W -p 7681 bash
        ports:
        - containerPort: 7681
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: cpp-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-sandbox-debian
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linux-sandbox-debian
  template:
    metadata:
      labels:
        app: linux-sandbox-debian
    spec:
      containers:
      - name: ttyd
        image: debian:stable-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - |
          apt-get update && apt-get install -y curl wget git vim
          wget -O /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x /usr/local/bin/ttyd
          ttyd -W -p 7681 bash
        ports:
        - containerPort: 7681
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: debian-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: linux-sandbox-alpine-svc
  namespace: default
spec:
  selector:
    app: linux-sandbox-alpine
  ports:
  - port: 7681
    targetPort: 7681
---
apiVersion: v1
kind: Service
metadata:
  name: python-sandbox-svc
  namespace: default
spec:
  selector:
    app: python-sandbox
  ports:
  - port: 7681
    targetPort: 7681
---
apiVersion: v1
kind: Service
metadata:
  name: cpp-sandbox-svc
  namespace: default
spec:
  selector:
    app: cpp-sandbox
  ports:
  - port: 7681
    targetPort: 7681
---
apiVersion: v1
kind: Service
metadata:
  name: linux-sandbox-debian-svc
  namespace: default
spec:
  selector:
    app: linux-sandbox-debian
  ports:
  - port: 7681
    targetPort: 7681
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-ingress
  namespace: default
spec:
  rules:
  - host: homelab.local
    http:
      paths:
      - path: /alpine
        pathType: Prefix
        backend:
          service:
            name: linux-sandbox-alpine-svc
            port:
              number: 7681
      - path: /python
        pathType: Prefix
        backend:
          service:
            name: python-sandbox-svc
            port:
              number: 7681
      - path: /cpp
        pathType: Prefix
        backend:
          service:
            name: cpp-sandbox-svc
            port:
              number: 7681
      - path: /debian
        pathType: Prefix
        backend:
          service:
            name: linux-sandbox-debian-svc
            port:
              number: 7681
