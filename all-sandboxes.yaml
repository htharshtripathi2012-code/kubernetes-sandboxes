apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alpine-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: python-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cpp-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: debian-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-sandbox-alpine
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: linux-sandbox-alpine
  template:
    metadata:
      labels:
        app: linux-sandbox-alpine
    spec:
      containers:
      - name: ttyd
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
        - apk add --no-cache ttyd bash vim btop htop && ttyd -W -p 7681 bash
        ports:
        - containerPort: 7681
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 7681
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 7681
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: alpine-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-sandbox
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: python-sandbox
  template:
    metadata:
      labels:
        app: python-sandbox
    spec:
      containers:
      - name: ttyd
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - |
          apt-get update && apt-get install -y curl wget git vim btop htop
          wget -O /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x /usr/local/bin/ttyd
          ttyd -W -p 7681 bash
        ports:
        - containerPort: 7681
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 7681
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 7681
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: python-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpp-sandbox
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: cpp-sandbox
  template:
    metadata:
      labels:
        app: cpp-sandbox
    spec:
      containers:
      - name: ttyd
        image: gcc:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          apt-get update && apt-get install -y curl wget git make vim btop htop
          wget -O /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x /usr/local/bin/ttyd
          ttyd -W -p 7681 bash
        ports:
        - containerPort: 7681
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /
            port: 7681
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 7681
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: cpp-pvc
---
