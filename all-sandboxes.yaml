apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alpine-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: python-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cpp-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: debian-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-sandbox-alpine
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: linux-sandbox-alpine
  template:
    metadata:
      labels:
        app: linux-sandbox-alpine
    spec:
      containers:
      - name: ttyd
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
        - "while true; do sleep 3600; done"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: alpine-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-sandbox
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: python-sandbox
  template:
    metadata:
      labels:
        app: python-sandbox
    spec:
      containers:
      - name: ttyd
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - "while true; do sleep 3600; done"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: python-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpp-sandbox
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: cpp-sandbox
  template:
    metadata:
      labels:
        app: cpp-sandbox
    spec:
      containers:
      - name: ttyd
        image: gcc:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - "while true; do sleep 3600; done"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: cpp-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-sandbox-debian
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: linux-sandbox-debian
  template:
    metadata:
      labels:
        app: linux-sandbox-debian
    spec:
      containers:
      - name: ttyd
        image: debian:stable-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - "while true; do sleep 3600; done"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: debian-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: linux-sandbox-alpine-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: linux-sandbox-alpine
  ports:
  - port: 7681
    targetPort: 7681
    nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: python-sandbox-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: python-sandbox
  ports:
  - port: 7681
    targetPort: 7681
    nodePort: 30085
---
apiVersion: v1
kind: Service
metadata:
  name: cpp-sandbox-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: cpp-sandbox
  ports:
  - port: 7681
    targetPort: 7681
    nodePort: 30086
---
apiVersion: v1
kind: Service
metadata:
  name: linux-sandbox-debian-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: linux-sandbox-debian
  ports:
  - port: 7681
    targetPort: 7681
    nodePort: 30087
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sandbox-ingress-route
  namespace: default
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`sandbox.local`) && PathPrefix(`/alpine`)
    kind: Rule
    services:
    - name: linux-sandbox-alpine-svc
      port: 7681
  - match: Host(`sandbox.local`) && PathPrefix(`/python`)
    kind: Rule
    services:
    - name: python-sandbox-svc
      port: 7681
  - match: Host(`sandbox.local`) && PathPrefix(`/cpp`)
    kind: Rule
    services:
    - name: cpp-sandbox-svc
      port: 7681
  - match: Host(`sandbox.local`) && PathPrefix(`/debian`)
    kind: Rule
    services:
    - name: linux-sandbox-debian-svc
      port: 7681
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-sandboxes
  namespace: default
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: default
spec:
  hard:
    pods: "10"
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
