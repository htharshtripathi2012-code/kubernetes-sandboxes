apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-sandbox-alpine
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linux-sandbox-alpine
  template:
    metadata:
      labels:
        app: linux-sandbox-alpine
    spec:
      containers:
      - name: ttyd
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
        - apk add --no-cache ttyd bash && ttyd -W -p 7681 bash
        ports:
        - containerPort: 7681
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: alpine-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-sandbox
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-sandbox
  template:
    metadata:
      labels:
        app: python-sandbox
    spec:
      containers:
      - name: ttyd
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - |
          apt-get update && apt-get install -y curl wget git vim
          wget -O /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x /usr/local/bin/ttyd
          ttyd -W -p 7681 bash
        ports:
        - containerPort: 7681
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: python-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpp-sandbox
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpp-sandbox
  template:
    metadata:
      labels:
        app: cpp-sandbox
    spec:
      containers:
      - name: ttyd
        image: gcc:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          apt-get update && apt-get install -y curl wget git make
          wget -O /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x /usr/local/bin/ttyd
          ttyd -W -p 7681 bash
        ports:
        - containerPort: 7681
        volumeMounts:
        - mountPath: /workspace
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: cpp-pvc
---
